#Docker-compose setup for OASIS ROFL
services:
    twap-oracle:
        image: 'ghcr.io/robin-markets/twap-oracle@sha256:c44bb323845c1c4aa02d6d4f968f0fed6abe130d03bbc9f51a6df8076ef83413'
        platform: linux/amd64
        environment:
            - SUBMIT_ONCHAIN=false
            - PORT=3000,8080
            - SUBGRAPH_URL=https://gateway.thegraph.com/api/deployments/id/QmaZXNmfnMPgNANBGFry9Z6EVGV1kGJDcdSE5wPGExi2o1
            - ORACLE_ADDRESS=0xf08a02deeB4C7A09fAc8e8C6f8508D724612796f
            - TWAP_SIGNER_PRIVATE_KEY=${TWAP_SIGNER_PRIVATE_KEY}
            - SUBGRAPH_AUTH_TOKEN=${SUBGRAPH_AUTH_TOKEN}
            - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
            - TELEGRAM_GROUP_CHAT_ID=${TELEGRAM_GROUP_CHAT_ID}
            - RPC_URL=${RPC_URL}
            - RATE_LIMIT_ENABLED=true
            - TRUST_PROXY=1 # trust one hop (the Oasis proxy in front of 8080)
            - IS_ROFL=true # running inside the Oasis ROFL TEE container
        ports:
            - '3000:3000'
            - '8080:8080'
        annotations:
            net.oasis.proxy.ports.8080.custom_domain: twap-rofl.robin.markets
