name: Build & verify ROFL release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Release version tag (e.g. v1.0.0)'
                required: true
                type: string

permissions:
    contents: write
    packages: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Verify tag does not already exist
              run: |
                  if git rev-parse "refs/tags/${{ inputs.version }}" >/dev/null 2>&1; then
                      echo "Tag ${{ inputs.version }} already exists" >&2
                      exit 1
                  fi

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: build_image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/twap-oracle:${{ inputs.version }}
                      ghcr.io/${{ github.repository_owner }}/twap-oracle:latest
                  provenance: false

            - name: Pin image digest in compose.yaml
              env:
                  IMAGE: ghcr.io/${{ github.repository_owner }}/twap-oracle@${{ steps.build_image.outputs.digest }}
              run: |
                  python3 - <<'EOF'
                  import os, re, pathlib
                  image = os.environ["IMAGE"]
                  path = pathlib.Path("compose.yaml")
                  text = path.read_text()
                  new = re.sub(r"image:\s*['\"]?[^\s'\"]+['\"]?", f"image: '{image}'", text, count=1)
                  path.write_text(new)
                  print(new)
                  EOF

            - uses: oasisprotocol/build-deploy-rofl-action@master
              with:
                  network: testnet
                  skip_update: true
                  skip_deploy: true
                  update_manifest: true

            - name: Create release branch, commit, and tag
              env:
                  BRANCH: release/${{ inputs.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -b "$BRANCH"
                  git add compose.yaml rofl.yaml
                  git commit -m "Release ${{ inputs.version }}

                  Image: ghcr.io/${{ github.repository_owner }}/twap-oracle@${{ steps.build_image.outputs.digest }}"
                  git tag "${{ inputs.version }}"
                  git push origin "$BRANCH"
                  git push origin "${{ inputs.version }}"

            - name: Create GitHub release with ORC bundle
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  bundle=$(ls *.orc | head -n1)
                  gh release create "${{ inputs.version }}" "$bundle" \
                      --target "release/${{ inputs.version }}" \
                      --title "${{ inputs.version }}" \
                      --notes "Verifiable ROFL release.

                  **Image:** \`ghcr.io/${{ github.repository_owner }}/twap-oracle@${{ steps.build_image.outputs.digest }}\`

                  ### Verify
                  \`\`\`
                  git clone <repo> && cd twap-oracle
                  git checkout ${{ inputs.version }}
                  oasis rofl build --verify
                  \`\`\`
                  Resulting enclave ID should match what is registered on-chain (\`oasis rofl show\`)."

            - name: Write build summary
              run: |
                  {
                      echo "## ROFL release ${{ inputs.version }}"
                      echo ""
                      echo "- Branch: \`release/${{ inputs.version }}\`"
                      echo "- Tag: \`${{ inputs.version }}\`"
                      echo "- Image: \`ghcr.io/${{ github.repository_owner }}/twap-oracle@${{ steps.build_image.outputs.digest }}\`"
                      echo ""
                      echo "### Deploy"
                      echo '```'
                      echo "git fetch --tags"
                      echo "git checkout ${{ inputs.version }}"
                      echo "oasis rofl update"
                      echo "oasis rofl deploy"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
