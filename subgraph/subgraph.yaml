specVersion: 1.3.0
indexerHints:
    prune: auto
schema:
    file: ./schema.graphql
dataSources:
    - kind: ethereum
      name: CTFExchange
      network: matic
      source:
          address: '0x4bFb41d5B3570DeFd03C39a9A4D8dE6Bd8B8982E'
          abi: CTFExchange
          startBlock: 85545773
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.9
          language: wasm/assemblyscript
          entities:
              - TokenIndex
          abis:
              - name: CTFExchange
                file: ./abis/CTFExchange.json
          eventHandlers:
              - event: OrderFilled(indexed bytes32,indexed address,indexed
                    address,uint256,uint256,uint256,uint256,uint256)
                handler: handleOrderFilled
          file: ./src/ctf-exchange.ts
    - kind: ethereum
      name: ConditionalTokens
      network: matic
      source:
          address: '0x4D97DCd97eC945f40cF65F87097ACe5EA0476045'
          abi: ConditionalTokens
          startBlock: 85545773
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.9
          language: wasm/assemblyscript
          entities:
              - TokenIndex
          abis:
              - name: ConditionalTokens
                file: ./abis/ConditionalTokens.json
          eventHandlers:
              - event: ConditionResolution(indexed bytes32,indexed address,indexed
                    bytes32,uint256,uint256[])
                handler: handleConditionResolution
          file: ./src/conditional-tokens.ts
    - kind: ethereum
      name: NegRiskCTFExchange
      network: matic
      source:
          address: '0xC5d563A36AE78145C45a50134d48A1215220f80a'
          abi: NegRiskCTFExchange
          startBlock: 85545773
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.9
          language: wasm/assemblyscript
          entities:
              - TokenIndex
          abis:
              - name: NegRiskCTFExchange
                file: ./abis/NegRiskCTFExchange.json
          eventHandlers:
              - event: OrderFilled(indexed bytes32,indexed address,indexed
                    address,uint256,uint256,uint256,uint256,uint256)
                handler: handleNegRiskOrderFilled
          file: ./src/ctf-exchange.ts
    - kind: ethereum
      name: CTFExchangeV2
      network: matic
      source:
          address: '0xe111180000d2663c0091e4f400237545b87b996b'
          abi: CTFExchangeV2
          startBlock: 85545773
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.9
          language: wasm/assemblyscript
          entities:
              - TokenIndex
          abis:
              - name: CTFExchangeV2
                file: ./abis/CTFExchangeV2.json
          eventHandlers:
              - event: OrderFilled(indexed bytes32,indexed address,indexed
                    address,uint8,uint256,uint256,uint256,uint256,bytes32,bytes32)
                handler: handleOrderFilledV2
          file: ./src/ctf-exchange.ts
    - kind: ethereum
      name: NegRiskCTFExchangeV2
      network: matic
      source:
          address: '0xe2222d279d744050d28e00520010520000310f59'
          abi: CTFExchangeV2
          startBlock: 85545773
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.9
          language: wasm/assemblyscript
          entities:
              - TokenIndex
          abis:
              - name: CTFExchangeV2
                file: ./abis/CTFExchangeV2.json
          eventHandlers:
              - event: OrderFilled(indexed bytes32,indexed address,indexed
                    address,uint8,uint256,uint256,uint256,uint256,bytes32,bytes32)
                handler: handleNegRiskOrderFilledV2
          file: ./src/ctf-exchange.ts
    - kind: ethereum
      name: RobinTwapOracle
      network: matic
      source:
          address: '0xf08a02deeb4c7a09fac8e8c6f8508d724612796f'
          abi: IRobinTwapOracle
          startBlock: 85545773
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.9
          language: wasm/assemblyscript
          entities:
              - Market
              - TokenIndex
          abis:
              - name: IRobinTwapOracle
                file: ./abis/IRobinTwapOracle.json
          eventHandlers:
              - event: MarketFinalized(indexed bytes32,uint256,uint256)
                handler: handleMarketFinalized
              - event: MarketInitialized(indexed bytes32,uint256,uint256,bool)
                handler: handleMarketInitialized
              - event: TwapUpdated(indexed bytes32,uint256,uint256)
                handler: handleTwapUpdated
          file: ./src/robin-twap-oracle.ts
