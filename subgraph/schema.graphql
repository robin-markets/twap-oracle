type TokenIndex @entity(immutable: false) {
    id: String! # positionId
    twapIndex: BigInt! # sum(price(1e6) * seconds), accumulated since tracking began
    backfillFrom: BigInt! # start of the not-yet-priced gap; the first fill after tracking began prices [backfillFrom, fill] at its own price
    startedAt: BigInt # timestamp of the first fill seen since tracking began
    lastUpdatedAt: BigInt # timestamp
    lastPrice: BigInt # 6 decimals
    resolvedAt: BigInt # set at resolution to freeze TWAP
    resolvedPrice: BigInt # 6 decimals
    isNegRisk: Boolean! # true if the token is a NegRisk token (from the MarketInitialized event)
    isV2: Boolean! # true once a fill from a V2 exchange contract has been seen
}

type Market @entity(immutable: false) {
    id: String! # conditionId hex
    yesToken: TokenIndex!
    noToken: TokenIndex!
    robinInitializedAt: BigInt!
    twapSnapshotYes: BigInt! # exchange twapIndex for YES at last contract update
    twapSnapshotNo: BigInt! # exchange twapIndex for NO at last contract update
    robinTwapIndexYes: BigInt
    robinLastUpdatedAt: BigInt
    robinResolvedAt: BigInt
    robinResolvedYesPrice: BigInt
    robinResolvedNoPrice: BigInt
}
